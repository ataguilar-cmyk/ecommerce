{% extends 'mainvista/base.html' %}

{% block content %}
<h2 class="mb-4">📋 Reservas Activas (Operador)</h2>

<div class="table-responsive">
    <table class="table table-striped table-hover bg-white shadow-sm">
        <thead class="table-dark">
            <tr>
                <th># Reserva</th>
                <th>Cliente</th>
                <th>Estado</th>
                <th>Total</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody>
            {% for reserva in reservas %}
            <tr>
                <td><strong>#{{ reserva.id }}</strong></td>
                <td>{{ reserva.cliente_nombre }}</td>
                <td>
                    <span class="badge
                        {% if reserva.estado == 'PENDIENTE' %}bg-warning text-dark
                        {% elif reserva.estado == 'CONFIRMADA' %}bg-success
                        {% else %}bg-danger{% endif %}">
                        {{ reserva.get_estado_display }}
                    </span>
                </td>
                <td>${{ reserva.total }}</td>
                <td>
                    <form action="{% url 'cambiar_estado' reserva.id %}" method="POST" class="d-inline">
                        {% csrf_token %}
                        <select
