<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viajes EBC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="navbar-nav">
    <a class="nav-link" href="{% url 'catalogo' %}">Catálogo de Paquetes</a>
    <a class="nav-link" href="{% url 'reservas' %}">Mis Reservas</a>
    {% if user.is_authenticated %}
    <a class="nav-link" href="{% url 'perfil' %}">{{ user.username }}</a>
    <a class="nav-link" href="{% url 'logout' %}">Cerrar sesión</a>
    {% else %}
    <a class="nav-link" href="{% url 'login' %}">Iniciar sesión</a>
    {% endif %}
    <a class="nav-link" href="/admin/" target="_blank">Panel Admin</a>
</div>
    </nav>

    <div class="container my-4">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
